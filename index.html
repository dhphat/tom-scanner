    <style>
      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior-y: contain;
        touch-action: none;
      }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
        50% { box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
      }
      .neon-text {
        text-shadow: 0 0 5px currentColor;
      }
      
      /* Centered Spin Animations for Background Decorations */
      @keyframes spin-centered {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
      @keyframes spin-centered-reverse {
        from { transform: translate(-50%, -50%) rotate(360deg); }
        to { transform: translate(-50%, -50%) rotate(0deg); }
      }
      .animate-spin-slow {
        animation: spin-centered 20s linear infinite;
      }
      .animate-reverse-spin {
        animation: spin-centered-reverse 15s linear infinite;
      }
    </style>
